<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Introduksjon til Claude</title>
<meta name="description" content="Kurs fra KI Norge. Følg presentasjonen, gjør oppgavene og del svarene, uten å logge inn.">
<meta property="og:title" content="Introduksjon til Claude">
<meta property="og:description" content="Kurs fra KI Norge. Følg presentasjonen, gjør oppgavene og del svarene, uten å logge inn.">
<meta name="theme-color" content="#F8F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1416" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 4h18a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-3l-6 5v-5H7a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z' fill='%23B42946'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=PT+Serif:wght@400;700&display=swap">
<style>
  /* Paletten er ki.norge.no sin: vinrødt og crimson, fersken og korall på varm papirbakgrunn. */
  :root {
    --paper: #F8F3EE; --surface: #FFFDFB; --ink: #292C30; --muted: #5B5D60; --heading: #541321;
    --accent: #B42946; --accent-hover: #912138; --accent-ink: #FFFFFF;
    --line: #E8DCD3; --line-strong: #CFBBAE;
    --bubble: #FCDCC6; --bubble-ink: #3B2417; --apricot: #E9B596; --blush: #F6E4E8;
    --coral: #F5898D; --coral-ink: #3F0D17; --ok: #056D13; --ok-bg: #DAEDDD;
    --note: #FCF0D9; --note-line: #ECD29C; --note-ink: #3D2B0B;
    --dark-bg: #541321; --dark-ink: #FBF3F1; --dark-soft: #FCC9A9; --dark-mark: #F5898D; --dark-line: rgba(252, 201, 169, .3);
    --scrim: rgba(52, 14, 22, .5); --shadow: 0 12px 32px rgba(84, 19, 33, .16);
    --mk-k: #FCDCC6; --mk-k-ink: #3B2417; --mk-k-line: #DE9D72;
    --mk-o: #F5898D; --mk-o-ink: #3F0D17; --mk-o-line: #B9404D;
    --mk-f: #EFC6D6; --mk-f-ink: #541321; --mk-f-line: #B86F8C;
    --serif: "PT Serif", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1416; --surface: #261B1E; --ink: #F1E8E9; --muted: #BBAAAD; --heading: #FAD9CF;
      --accent: #EE8A9C; --accent-hover: #F6A7B4; --accent-ink: #2B0A12;
      --line: #3A2A2E; --line-strong: #5C454B;
      --bubble: #3D2A21; --bubble-ink: #F9E7DB; --apricot: #C9906F; --blush: #3A2328;
      --coral: #F5898D; --coral-ink: #3F0D17; --ok: #8FD49A; --ok-bg: #1D3822;
      --note: #342A1A; --note-line: #6E5630; --note-ink: #F5E6C4;
      --dark-bg: #3F0E19; --dark-ink: #FBF3F1; --dark-soft: #FCC9A9; --dark-mark: #F5898D; --dark-line: rgba(252, 201, 169, .22);
      --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
      --mk-k: #4D3520; --mk-k-ink: #F9E7DB; --mk-k-line: #D19A6E;
      --mk-o: #F5898D; --mk-o-ink: #3F0D17; --mk-o-line: #FFC2C4;
      --mk-f: #5A2A44; --mk-f-ink: #FBDDE8; --mk-f-line: #E296B2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1416; --surface: #261B1E; --ink: #F1E8E9; --muted: #BBAAAD; --heading: #FAD9CF;
    --accent: #EE8A9C; --accent-hover: #F6A7B4; --accent-ink: #2B0A12;
    --line: #3A2A2E; --line-strong: #5C454B;
    --bubble: #3D2A21; --bubble-ink: #F9E7DB; --apricot: #C9906F; --blush: #3A2328;
    --coral: #F5898D; --coral-ink: #3F0D17; --ok: #8FD49A; --ok-bg: #1D3822;
    --note: #342A1A; --note-line: #6E5630; --note-ink: #F5E6C4;
    --dark-bg: #3F0E19; --dark-ink: #FBF3F1; --dark-soft: #FCC9A9; --dark-mark: #F5898D; --dark-line: rgba(252, 201, 169, .22);
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    --mk-k: #4D3520; --mk-k-ink: #F9E7DB; --mk-k-line: #D19A6E;
    --mk-o: #F5898D; --mk-o-ink: #3F0D17; --mk-o-line: #FFC2C4;
    --mk-f: #5A2A44; --mk-f-ink: #FBDDE8; --mk-f-line: #E296B2;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 18px; line-height: 1.55;
    padding-bottom: var(--foot-h, 72px);
  }
  a { color: var(--accent); text-underline-offset: .18em; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Topp ---------- */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 20px 10px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--heading); white-space: nowrap; }
  .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .grow { flex: 1; }
  .progress { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: var(--accent); transition: width .3s ease; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 14px;
    border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface);
    font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  button.chip:hover { border-color: var(--accent); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .chip .dot.on { background: var(--ok); }
  .chip.following::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .chip.action { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip.action:hover { background: var(--accent-hover); }
  .chip.hands { background: var(--coral); border-color: var(--coral); color: var(--coral-ink); font-weight: 600; }
  .chip.timeup { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .joinhint { font-size: 15px; color: var(--muted); white-space: nowrap; }
  .joinhint b { color: var(--heading); font-weight: 600; }

  /* ---------- Scenen ---------- */
  .stage { min-height: calc(100vh - var(--head-h, 60px) - var(--foot-h, 72px)); min-height: calc(100dvh - var(--head-h, 60px) - var(--foot-h, 72px)); transition: background-color .35s ease, color .35s ease; }
  body.dark-slide .stage { background: var(--dark-bg); color: var(--dark-ink); }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 24px 72px; }
  @media (max-width: 640px) { main { padding: 28px 16px 56px; } }

  .mode { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 18px; padding: 5px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .mode.se { background: var(--blush); color: var(--heading); }
  .mode.gjor { background: var(--accent); color: var(--accent-ink); }
  .mode.del { background: var(--bubble); color: var(--bubble-ink); }
  .kicker { margin: 0 0 12px; color: var(--accent); font-weight: 600; font-size: 16px; }
  h1.title {
    font-family: var(--serif); font-weight: 700; color: var(--heading);
    font-size: clamp(36px, 5.6vw, 64px); line-height: 1.05; letter-spacing: -.01em;
    margin: 0 0 18px; max-width: 18ch; text-wrap: balance;
  }
  .lead { font-size: clamp(19px, 2.2vw, 24px); color: var(--muted); margin: 0; max-width: 44ch; }
  .slide p { max-width: 64ch; }
  body.dark-slide .kicker { color: var(--dark-soft); }
  body.dark-slide h1.title { color: var(--dark-ink); }
  body.dark-slide .lead { color: var(--dark-soft); }
  body.dark-slide a { color: var(--dark-soft); }

  /* Prompter er replikker i en samtale, ikke kode. */
  .say { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .bubble {
    flex: 1 1 280px; margin: 0; padding: 14px 20px;
    background: var(--bubble); color: var(--bubble-ink);
    border-radius: 20px 20px 4px 20px; font-size: 18px; line-height: 1.45; overflow-wrap: anywhere;
    transition: box-shadow .2s ease;
  }
  .say.copied .bubble { box-shadow: 0 0 0 2px var(--accent); }
  .copy, .small-btn {
    flex: none; min-height: 38px; padding: 6px 16px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--surface); font-size: 14px; font-weight: 600;
  }
  .copy:hover, .small-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy.done, .copy.done:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* Steg: bare det aktive er åpent, resten tar lite plass. */
  .steps { list-style: none; margin: 40px 0 0; padding: 0; display: grid; gap: 12px; max-width: 780px; }
  .step { border: 1px solid var(--line); border-radius: 18px; padding: 14px 20px; background: var(--surface); }
  .step .h { display: flex; gap: 14px; align-items: baseline; }
  .step .no { flex: none; min-width: 1.4em; font-family: var(--serif); font-weight: 700; color: var(--accent); }
  .step .t { flex: 1; }
  .step .body { display: grid; gap: 18px; margin-top: 18px; }
  .step.current { padding: 24px 24px 26px; border: 2px solid var(--accent); }
  .step.current .t { font-size: 20px; font-weight: 600; }
  .step.done { background: transparent; border-style: dashed; color: var(--muted); }
  .step.done .no { color: var(--ok); }
  .step.later { background: transparent; color: var(--muted); }
  .step.bonus { border-style: dashed; background: transparent; }
  .step.bonus .no { color: var(--apricot); }
  .step .acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .step .count-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 10px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .meter { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .finished { margin: 28px 0 0; font-weight: 600; color: var(--ok); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 42px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--surface);
    font-size: 15px; font-weight: 600; line-height: 1.1; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.stop { background: var(--heading); border-color: var(--heading); color: var(--paper); }
  .btn.round { width: 44px; padding: 0; font-size: 19px; }
  .btn.emoji { width: 44px; padding: 0; font-size: 20px; }
  .btn.hand-on { background: var(--coral); border-color: var(--coral); color: var(--coral-ink); }
  .btn.on { background: var(--note); border-color: var(--note-line); color: var(--note-ink); }
  .btn.quiet { border-color: transparent; background: transparent; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: .2em; }
  .btn.quiet:hover:not(:disabled) { border-color: transparent; color: var(--accent); }

  .tracks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 28px 0 0; font-size: 14px; color: var(--muted); max-width: 780px; }
  .tracks button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
  .tracks button[aria-pressed="true"] { background: var(--heading); border-color: var(--heading); color: var(--paper); }

  /* Avstemninger */
  .polls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 36px 44px; margin: 40px 0 0; max-width: 1080px; }
  .poll { margin: 0; max-width: 780px; }
  .step .poll { margin-top: 4px; }
  .poll h2 { margin: 0 0 14px; font-family: var(--serif); font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; color: var(--heading); }
  .opts { display: grid; gap: 8px; }
  .opt {
    position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 13px 18px; border-radius: 14px;
    border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 17px;
  }
  .opt .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--bubble); transition: width .4s ease; }
  .opt > span:not(.fill) { position: relative; }
  .opt .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
  .opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--blush); font-weight: 600; }
  div.opt { cursor: default; }

  /* Veggen */
  .wall { margin: 18px 0 0; display: grid; gap: 14px; max-width: 780px; }
  .post-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .post-form input { flex: 1 1 260px; font-size: 17px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--paper); }
  .post-form input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .posts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .posts li { padding: 12px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 17px; overflow-wrap: anywhere; }
  .posts li.fresh { animation: pop .5s ease; }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .posts-empty { color: var(--muted); font-size: 15px; margin: 0; }
  .wall-h { margin: 44px 0 0; font-size: 15px; font-weight: 600; color: var(--muted); }

  /* Neste ord */
  .models { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 40px 0 0; max-width: 880px; }
  @media (max-width: 640px) { .models { grid-template-columns: 1fr 1fr; } }
  .models div { padding: 18px 18px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  .models b { display: block; font-family: var(--serif); font-size: 26px; color: var(--heading); }
  .models span { font-size: 15px; color: var(--muted); }
  .scale { display: flex; justify-content: space-between; max-width: 880px; margin-top: 10px; font-size: 14px; color: var(--muted); }

  .meme { margin: 44px 0 0; max-width: 420px; }
  .shot { margin: 28px 0 0; max-width: 680px; }
  .shot img { display: block; width: 100%; height: auto; border-radius: 12px; }
  .shot figcaption { margin-top: 8px; font-size: 15px; color: var(--muted); }
  .dark-slide .shot figcaption { color: var(--dark-soft); }
  .meme img { display: block; width: 100%; height: auto; border-radius: 12px; }

  /* Startsiden: lenken og QR-koden er store, så de kan leses og skannes fra bakerst i rommet. */
  .qr { display: flex; gap: 24px 40px; align-items: center; flex-wrap: wrap; margin-top: 36px; }
  .join-text { flex: 1 1 380px; min-width: 0; container-type: inline-size; }
  .join-k { display: block; margin-bottom: 8px; font-size: clamp(18px, 1.6vw, 26px); color: var(--dark-soft); }
  .qr .url { margin: 0; font-family: var(--serif); font-weight: 700; font-size: min(64px, 7.4cqi); line-height: 1.1; color: var(--dark-ink); }
  .qr .url span { display: block; white-space: nowrap; }
  .join-or { font-size: clamp(18px, 1.6vw, 26px); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dark-soft); }
  .join-code { text-align: center; }
  .join-code svg { display: block; width: clamp(220px, 36vh, 380px); height: auto; padding: 14px; background: #fff; border-radius: 16px; }
  .lobby { margin: 28px 0 0; color: var(--dark-soft); font-size: 18px; }
  @media (max-width: 640px) { .join-or, .join-code { display: none; } }
  .lobby b { display: inline-block; margin-right: 12px; font-family: var(--serif); font-size: clamp(48px, 6vw, 96px); line-height: 1; color: var(--dark-ink); font-variant-numeric: tabular-nums; }
  .lobby.bump b { animation: bump .5s ease; }
  @keyframes bump { 40% { transform: scale(1.12); } }

  .list { margin: 32px 0 0; padding: 0 0 0 1.2em; max-width: 64ch; display: grid; gap: 10px; }
  .links { margin: 44px 0 0; max-width: 780px; }
  .links h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .links ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .links a { font-weight: 600; font-size: 18px; }
  .links span { display: block; color: var(--muted); font-size: 15px; }

  /* Presentørens notater: en gul lapp. */
  .notes {
    margin-top: 28px; max-width: 72ch; padding: 16px 20px;
    background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line);
    border-radius: 4px 4px 16px 4px; font-size: 16px;
  }
  .notes h2 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
  .notes p { margin: 0 0 8px; }
  .notes p:last-child { margin: 0; }
  .notes .next { margin-top: 12px; font-weight: 600; }
  .notes b { font-weight: 700; }
  .notes p.do { font-style: italic; }
  .notes h2 small { font-weight: 400; }
  .notes textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--note-line); background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; line-height: 1.5; resize: vertical; }
  .notes-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

  /* ---------- Bunnlinje ---------- */
  footer.bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--paper); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) {
    header.top { padding-left: 16px; padding-right: 16px; gap: 8px; }
    .brand { font-size: 16px; }
    .count, .btn .lbl, .status, #meBtn.named { display: none; }
    .chip { padding: 6px 12px; }
    footer.bar { gap: 6px; padding-left: 10px; padding-right: 10px; }
    .group { gap: 4px; }
    .btn { padding: 8px 12px; }
    .btn.round, .btn.emoji, #handBtn { width: 40px; padding: 0; }
    .step.current { padding: 18px 16px 20px; }
  }

  /* ---------- Malmodus ---------- */
  body.mal-edit #counter, body.mal-edit #chapters, body.mal-edit #menuBtn, body.mal-edit footer.bar { display: none; }
  .mal-steps { list-style: none; counter-reset: mal; margin: 36px 0 0; padding: 0; display: grid; gap: 18px; max-width: 880px; }
  .mal-steps > li { counter-increment: mal; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px 22px; }
  .mal-steps h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 24px; color: var(--heading); }
  .mal-steps h2::before { content: counter(mal) ". "; color: var(--accent); }
  .mal-steps p { margin: 0 0 12px; }
  .mal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 18px; }
  .mal-field { display: grid; gap: 6px; margin: 0 !important; }
  .mal-field label, .mal-label { font-size: 15px; font-weight: 600; }
  .mal-field input, #malIn { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 10px 14px; }
  .mal-field input:focus, #malIn:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  #malIn { display: block; width: 100%; margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; resize: vertical; }
  .mal .bubble { white-space: pre-line; }
  .mal details { margin: 12px 0 8px; }
  .mal summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  .mal pre { white-space: pre-wrap; max-height: 320px; overflow: auto; margin: 10px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--paper); font-size: 13px; line-height: 1.5; }
  .mal-check { margin: 10px 0 12px !important; font-weight: 600; }
  .mal-check.ok { color: var(--ok); }
  .mal-check.bad { color: var(--accent); }
  .mal-help { margin-top: 16px; font-size: 16px; }
  .brand { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* ---------- Skjermen i møterommet ---------- */
  body.screen { font-size: 22px; padding-bottom: 0; }
  body.screen footer.bar, body.screen #menuBtn, body.screen .tracks, body.screen .post-form, body.screen .copy { display: none !important; }
  body.screen main { max-width: 1400px; padding-top: 32px; }
  body.screen h1.title { font-size: clamp(48px, min(6.4vw, 9.5vh), 92px); }
  body.screen main:has(.qr) { max-width: 1760px; }
  body.screen .join-code svg { width: min(48vh, 540px); }
  body.screen .qr .url { font-size: min(76px, 7.4cqi); }
  body.screen .join-k, body.screen .join-or { font-size: 30px; }
  body.screen .meme { max-width: 520px; }
  body.screen .slide.side aside .shot { margin-top: 0; max-width: none; }
  body.screen .stage { min-height: calc(100dvh - var(--head-h, 60px)); }
  body.screen .joinhint { font-size: 18px; }
  body.screen #countChip { font-size: 24px; min-height: 44px; padding: 6px 18px; }
  body.screen .opt { font-size: 22px; padding: 12px 22px; }
  body.screen .wall-h { font-size: 18px; }
  body.screen .opt .n { font-size: 20px; }
  body.screen .bubble { font-size: 21px; }
  body.screen .posts li { font-size: 21px; }
  body.screen .steps, body.screen .poll, body.screen .wall, body.screen .styleprompt { max-width: 980px; }
  body.screen .step { padding: 14px 22px; }
  body.screen .step .body { margin-top: 12px; gap: 12px; }
  body.screen .step.focus { border: 2px solid var(--accent); }
  /* Brede skjermer: veggen, stilprompten og memen står i en egen kolonne, så de ikke havner under kanten. */
  @media (min-width: 1200px) {
    body.screen .slide.side { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); column-gap: 64px; align-items: start; }
    body.screen .slide.side > aside { position: sticky; top: calc(var(--head-h, 60px) + 32px); }
    body.screen .slide.side > aside > :first-child { margin-top: 0; }
    body.screen .slide.side .meme { max-width: none; }
    body.screen .slide.side .meme img { width: auto; max-width: 100%; max-height: calc(100dvh - var(--head-h, 60px) - 96px); }
    body.screen .slide.side aside > * + .meme img { max-height: 36vh; }
      body.screen aside .styleprompt .wall-h { font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1.2; color: inherit; }
  }

  /* ---------- Paneler ---------- */
  .panel {
    position: fixed; z-index: 12; top: calc(var(--head-h, 60px) + 8px); right: 16px;
    width: min(400px, calc(100vw - 32px)); max-height: min(72vh, 600px); overflow: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px;
  }
  .panel .go { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font-size: 16px; }
  .panel .go:hover, .panel .go[aria-current="page"] { background: var(--blush); }
  .panel .go span { min-width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; }
  #roster { padding: 16px 18px; }
  #roster h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 22px; color: var(--heading); }
  #roster h3 { margin: 14px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  #roster h3 span { color: var(--ink); }
  .names { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: q; }
  .names li { padding: 3px 12px; border-radius: 999px; background: var(--blush); font-size: 15px; }
  .names li small { color: var(--muted); }
  ol.names li { background: var(--coral); color: var(--coral-ink); }
  ol.names li::before { counter-increment: q; content: counter(q) ". "; font-weight: 600; }
  .names li.anon { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); }
  .names li.me { font-weight: 700; }
  #qpanel { padding: 16px 18px; width: min(460px, calc(100vw - 32px)); }
  #qpanel h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 22px; color: var(--heading); }
  #qpanel .fine { margin: 6px 0 0; color: var(--muted); }
  .qs { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .qs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); font-size: 16px; overflow-wrap: anywhere; }
  .qs li.done { background: transparent; border-style: dashed; color: var(--muted); }
  .qs small { color: var(--muted); }
  .qs .likes { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .qs .like[aria-pressed="true"] { background: var(--bubble); border-color: var(--apricot); color: var(--bubble-ink); }
  .qs .tools { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  ol.names li.anon::before { content: none; }
  .empty { margin: 0; color: var(--muted); font-size: 16px; }

  /* ---------- Bli med ---------- */
  .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
  .sheet { width: min(440px, 100%); background: var(--surface); border-radius: 22px; padding: 28px; box-shadow: var(--shadow); }
  .sheet h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 30px; line-height: 1.15; color: var(--heading); }
  .sheet p { margin: 0 0 18px; color: var(--muted); font-size: 17px; }
  .sheet input { width: 100%; font-size: 20px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--paper); }
  .sheet input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .sheet .err { margin: 6px 0 10px; min-height: 1.4em; color: var(--accent); font-size: 15px; }
  .sheet .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 640px) {
    .scrim { place-items: end center; padding: 0; }
    .sheet { border-radius: 22px 22px 0 0; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  }

  /* ---------- Reaksjoner og beskjeder ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
  .float { position: absolute; bottom: calc(var(--foot-h, 72px) + 8px); font-size: 36px; animation: rise 2.4s cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes rise {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    12% { transform: translateY(-28px) scale(1.08); opacity: 1; }
    100% { transform: translateY(-380px) scale(1); opacity: 0; }
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--foot-h, 72px) + 14px); z-index: 30;
    transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 999px;
    background: var(--heading); color: var(--paper); font-size: 15px; text-align: center;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  body.dark-slide .toast { background: var(--dark-soft); color: var(--dark-bg); }
  /* ---------- Kapittelkart ---------- */
  .chapters { display: flex; gap: 4px; list-style: none; margin: 0 0 0 6px; padding: 0; }
  .chapters li { font-size: 13px; padding: 3px 10px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .chapters li.done { color: var(--ink); }
  .chapters li.on { background: var(--blush); color: var(--heading); font-weight: 600; }
  @media (max-width: 1100px) { .chapters li:not(.on) { display: none; } }
  @media (max-width: 640px) { .chapters { display: none; } }

  /* ---------- Fasit, mørke brudd, tall ---------- */
  .opt.right { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-bg); font-weight: 600; }
  .opt.right .fill { background: var(--ok-bg); }
  .opt.wrong { color: var(--muted); border-style: dashed; }
  .opt:disabled { cursor: default; }
  .explain { margin: 16px 0 0; font-weight: 600; max-width: 60ch; }
  body.dark-slide .poll h2, body.dark-slide .opt { color: var(--dark-ink); }
  body.dark-slide .opt { background: rgba(255, 255, 255, .06); border-color: var(--dark-line); }
  body.dark-slide .opt .fill { background: rgba(252, 201, 169, .22); }
  body.dark-slide .opt .n, body.dark-slide .explain, body.dark-slide .wall-h, body.dark-slide .fine { color: var(--dark-soft); }
  body.dark-slide .opt.wrong { color: rgba(251, 243, 241, .82); }
  body.dark-slide .opt[aria-pressed="true"] { border-color: var(--dark-soft); box-shadow: 0 0 0 2px rgba(252, 201, 169, .25); }
  body.dark-slide .opt.right { border-color: #8FD49A; box-shadow: 0 0 0 2px rgba(143, 212, 154, .25); }
  body.dark-slide .opt.right .fill { background: rgba(143, 212, 154, .22); }
  body.dark-slide .copy { background: transparent; border-color: var(--dark-line); color: var(--dark-ink); }
  .styleprompt { margin: 36px 0 0; max-width: 780px; display: grid; gap: 10px; }
  .styleprompt .wall-h { margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 44px 0 0; max-width: 1080px; }
  @media (max-width: 640px) { .stats { grid-template-columns: 1fr 1fr; } }
  .stats div { padding: 20px 22px; border-radius: 18px; background: rgba(255, 255, 255, .06); border: 1px solid var(--dark-line); }
  .stats b { display: block; font-family: var(--serif); font-size: clamp(48px, 7vw, 92px); line-height: 1; color: var(--dark-ink); font-variant-numeric: tabular-nums; }
  .stats span { display: block; margin-top: 8px; line-height: 1.3; color: var(--dark-soft); font-size: 16px; }
  body.screen .stats span { font-size: 20px; }
  .allset { display: inline-flex; align-items: center; gap: 8px; margin: 32px 0 -16px; padding: 8px 16px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .cheat-btn { margin-top: 36px; }

  /* ---------- Oversikten over sidene ---------- */
  .sorter { position: fixed; inset: 0; z-index: 22; background: var(--scrim); overflow: auto; padding: 24px 16px; }
  .sorter-in { width: min(1240px, 100%); margin: 0 auto; background: var(--paper); border-radius: 24px; padding: 22px 26px 30px; box-shadow: var(--shadow); }
  .sorter-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sorter-head h2 { margin: 0; font-family: var(--serif); font-size: 30px; color: var(--heading); }
  .sorter-sum { margin: 0; flex: 1 1 260px; color: var(--muted); font-size: 16px; }
  .sorter-hint { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .sorter-group h3 { margin: 22px 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr 1fr; gap: 10px; } .sorter-in { padding: 18px 14px 24px; } }
  .card { display: grid; gap: 6px; position: relative; }
  .card-go { display: flex; flex-direction: column; gap: 4px; width: 100%; aspect-ratio: 16 / 10; text-align: left; padding: 11px 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
  .card-go:hover { border-color: var(--accent); }
  .card.dark .card-go { background: var(--dark-bg); border-color: var(--dark-bg); color: var(--dark-ink); }
  .card.cur .card-go { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; }
  .card-no { font-family: var(--serif); font-weight: 700; font-size: 15px; color: var(--accent); }
  .card.dark .card-no { color: var(--dark-mark); }
  .card-mode { padding: 1px 8px; border-radius: 99px; font-weight: 600; background: var(--blush); color: var(--heading); }
  .card-mode.gjor { background: var(--accent); color: var(--accent-ink); }
  .card-mode.del { background: var(--bubble); color: var(--bubble-ink); }
  .card-kick { font-size: 12px; font-weight: 600; color: var(--accent); }
  .card.dark .card-kick { color: var(--dark-soft); }
  .card-title { font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.15; color: var(--heading); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card.dark .card-title { color: var(--dark-ink); }
  .card-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .card.dark .card-foot { color: var(--dark-soft); }
  .card-foot b { font-weight: 700; color: var(--heading); white-space: nowrap; }
  .card.dark .card-foot b { color: var(--dark-ink); }
  .card.off .card-go, .card.off.dark .card-go { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--muted); }
  .card.off .card-title, .card.off .card-kick, .card.off .card-no, .card.off .card-foot, .card.off .card-foot b { color: var(--muted); }
  .card-badge { position: absolute; top: -9px; left: 10px; padding: 2px 9px; border-radius: 99px; background: var(--ok); color: var(--ok-bg); font-size: 11px; font-weight: 700; }
  .card-toggle { min-height: 32px; border-radius: 99px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
  .card-toggle:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
  .card-toggle[aria-pressed="false"] { border-color: var(--line-strong); background: var(--surface); color: var(--accent); }
  .card-toggle:disabled { opacity: .7; cursor: default; }

  /* ---------- Illustrasjoner ---------- */
  .art { margin: 36px 0 0; max-width: 1040px; }
  .art-prompt { max-width: 820px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
  .art-step { margin: 0; font-weight: 600; color: var(--heading); }
  .art-bub { margin: 0; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: var(--bubble); color: var(--bubble-ink); font-size: 15px; }
  .art-bub small { display: block; margin-top: 2px; font-size: 12px; color: var(--bubble-ink); }
  .art-prompt .legend { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
  .art-prompt mark { border-radius: 6px; padding: 1px 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  /* Hver del har sin egen tone og en understrek i en sterkere variant, så grensene synes. */
  mark.k { background: var(--mk-k); color: var(--mk-k-ink); box-shadow: inset 0 -2px 0 var(--mk-k-line); }
  mark.o { background: var(--mk-o); color: var(--mk-o-ink); box-shadow: inset 0 -2px 0 var(--mk-o-line); }
  mark.f { background: var(--mk-f); color: var(--mk-f-ink); box-shadow: inset 0 -2px 0 var(--mk-f-line); }
  .art-label { margin: 14px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .art-prompt-text { margin: 0; font-size: 17px; line-height: 1.75; }
  .art-mappe { max-width: 680px; }
  .folder-tab { display: inline-block; margin: 0; padding: 8px 16px; border-radius: 14px 14px 0 0; background: var(--apricot); color: var(--coral-ink); font-weight: 700; }
  .folder-body { border: 2px solid var(--apricot); border-radius: 0 18px 18px 18px; padding: 16px; display: grid; gap: 12px; background: var(--surface); }
  .folder-item { margin: 0; font-size: 15px; }
  .folder-item b { display: block; color: var(--heading); }
  .folder-chats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  body.screen .art-step, body.screen .art-prompt-text { font-size: 21px; }
  body.screen .art-bub, body.screen .folder-item { font-size: 18px; }

  /* ---------- Spotlight og jukseark ---------- */
  .spot { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: 24px; background: var(--scrim); }
  .spot-card { width: min(920px, 100%); background: var(--surface); border-radius: 24px; padding: 36px 40px 28px; box-shadow: var(--shadow); }
  .spot-card .kick { margin: 0 0 12px; color: var(--accent); font-weight: 600; }
  .spot-card blockquote { margin: 0 0 24px; font-family: var(--serif); font-size: clamp(26px, 3.6vw, 46px); line-height: 1.25; color: var(--heading); overflow-wrap: anywhere; }
  .posts li { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .spot-btn { flex: none; min-height: 32px; padding: 4px 12px; font-size: 13px; }
  .sheet.cheat { width: min(780px, 100%); max-height: 92vh; overflow: auto; }
  .cheat section { margin: 0 0 18px; }
  .cheat h3 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
  .cheat .bubble { font-size: 16px; }
  .cheat p { color: var(--ink); }
  .cheat .acts { position: sticky; bottom: -28px; background: var(--surface); padding: 12px 0 0; }

  /* ---------- Tidtaker og konfetti ---------- */
  .timer { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .timer.warn { color: #8a5d00; font-weight: 600; }
  .timer.late { color: var(--accent); font-weight: 700; }
  .confetti { position: absolute; top: -48px; font-size: 30px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(112vh) rotate(540deg); } }

  @media print {
    body * { visibility: hidden; }
    #cheat, #cheat * { visibility: visible; }
    #cheatWrap { position: static; background: none; padding: 0; }
    #cheat { position: absolute; left: 0; top: 0; width: 100%; max-height: none; box-shadow: none; }
    #cheat .acts { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .confetti { display: none; }
    .float { animation: fade 1.6s ease forwards; }
    @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
    .stage, .progress, .toast, .bubble, .meter i, .opt .fill { transition: none; }
    .posts li.fresh, .lobby.bump b { animation: none; }
  }
</style>
</head>
<body>

<header class="top" id="top">
  <span class="brand">Introduksjon til Claude</span>
  <span class="count" id="counter"></span>
  <ol class="chapters" id="chapters" aria-label="Kapitlene"></ol>
  <span class="joinhint hidden" id="joinHint"></span>
  <span class="grow"></span>
  <span class="chip hidden" id="countChip"></span>
  <button class="chip hidden" id="qChip" aria-expanded="false" aria-controls="qpanel"></button>
  <button class="chip hidden" id="roomChip" aria-expanded="false" aria-controls="roster"></button>
  <button class="chip hidden" id="followBtn"></button>
  <button class="chip hidden" id="fullBtn" title="Fullskjerm, eller trykk F">Fullskjerm</button>
  <button class="chip" id="menuBtn" aria-expanded="false" aria-controls="overview">Sider</button>
  <span class="progress" id="progress"></span>
</header>

<div class="sorter hidden" id="overview" role="dialog" aria-modal="true" aria-labelledby="sorterTitle">
  <div class="sorter-in">
    <div class="sorter-head"><h2 id="sorterTitle">Alle sider</h2><p class="sorter-sum" id="sorterSum"></p><button class="btn hidden" id="resetBtn" title="Fjern svar, steg, innlegg, spørsmål og hender fra øvingen">Nullstill alt</button><button class="btn" id="closeSorter">Lukk</button></div>
    <p class="sorter-hint" id="sorterHint"></p>
    <div id="sorterBody"></div>
  </div>
</div>
<div id="roster" class="panel hidden"></div>
<div id="qpanel" class="panel hidden"></div>
<div class="stage" id="stage"><main><article id="slide" class="slide"></article></main></div>
<div id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="spot hidden" id="spot" role="dialog" aria-label="Løftet fram fra veggen">
  <div class="spot-card"><p class="kick" id="spotKick">Fra veggen</p><blockquote id="spotText"></blockquote><button class="btn" id="spotClose">Lukk</button></div>
</div>

<div class="scrim hidden" id="cheatWrap">
  <article class="sheet cheat" id="cheat" role="dialog" aria-modal="true" aria-labelledby="cheatTitle">
    <div id="cheatBody"></div>
    <div class="acts">
      <button class="btn primary" id="printBtn">Skriv ut eller lagre som PDF</button>
      <button class="btn" id="copyCheat">Kopier som tekst</button>
      <button class="btn quiet" id="closeCheat">Lukk</button>
    </div>
  </article>
</div>

<div class="scrim hidden" id="join">
  <form class="sheet" id="joinForm" role="dialog" aria-modal="true" aria-labelledby="joinTitle" novalidate>
    <h2 id="joinTitle">Hva heter du?</h2>
    <p>Navnet vises for alle i kurset, så dere ser hvem som er her og hvem som rekker opp hånda. Ingen innlogging.</p>
    <label class="vh" for="joinName">Navn</label>
    <input id="joinName" autocomplete="given-name" maxlength="32" placeholder="Fornavn" enterkeyhint="go" spellcheck="false">
    <p class="err" id="joinErr" role="alert"></p>
    <div class="acts">
      <button class="btn primary" type="submit" id="joinOk">Bli med</button>
      <button class="btn quiet" type="button" id="joinSkip">Bare se på</button>
    </div>
  </form>
</div>

<footer class="bar" id="bar">
  <div class="group">

  // ---------- Steg, svar og vegg ----------

  function postTo(wall, text) {

  // ---------- Navigasjon ----------
  function go(n, opts) {

  // Går presentøren videre uten å vise svaret, vises det likevel. Da står ingen fast bak gjetningen.

    });

  function jumpTo(id) {

  // Presentøren ser hvor mange som blar selv, og kan ta dem med tilbake.

  // Backstage vises aldri for publikum, så den sendes ikke.

    } else {

  // ---------- Tidtaker ----------
  // Tid siden presentasjonen startet, mot planen fram til siden presentøren står på.
  function updateTimer() {
    var el = $("#timer"), d = new Date(), clock = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    if (!st.isPresenter) { el.textContent = ""; el.className = "timer"; return; }
    if (!live() || !st.live.since) { el.textContent = clock; el.className = "timer"; return; }
    var v = visible(), plan = 0, mins = (Date.now() - st.live.since) / 60000;
    for (var k = 0; k < st.i; k++) if (!v[k].reserve && v[k].min) plan += v[k].min;
    var behind = mins - plan, cuts = v.slice(st.i + 1).filter(function (x) { return x.cut; }).map(function (x) { return x.title; });
    el.className = "timer" + (behind > 5 ? " late" : behind > 2 ? " warn" : "");
    el.textContent = clock + "  ·  " + Math.floor(mins) + " min inn, planen sier " + String(Math.round(plan * 10) / 10).replace(".", ",") +
      (behind > 2 && cuts.length ? ". Kan kuttes: " + cuts.join(", ") : "");
  }
  setInterval(updateTimer, 15000);

  // ---------- Nedtelling ----------

  function updateCount() {
    var chip = $("#countChip"), btn = $("#countBtn"), s = current(), left = countLeft();
    var running = left !== null && left > 0, over = left !== null && left <= 0 && left > -15000;
    chip.classList.toggle("hidden", !running && !over);
    chip.classList.toggle("timeup", over);
    chip.textContent = running ? "⏱ " + fmtClock(left) : over ? "Tiden er ute" : "";
    btn.classList.toggle("hidden", !LIVE_URL || !st.isPresenter || (!running && !(s.min && s.mode !== "se")));
    btn.textContent = running ? "⏱ " + fmtClock(left) + " Stopp" : "⏱ " + fmtMin(s.min || 1);
    btn.setAttribute("aria-label", running ? "Stopp nedtellingen, " + fmtClock(left) + " igjen" : "Start nedtelling på " + fmtMin(s.min || 1) + " for alle");
    btn.disabled = !net.open || !st.verified;
  }
  setInterval(updateCount, 1000);

  // ---------- Spørsmål fra salen ----------

    if (!item || !item.id) return;

    st.questions.push(item);
  }
  function qHtml() {
    var list = st.questions.slice().sort(function (a, b) { return (a.done - b.done) || (b.likes - a.likes) || (a.at - b.at); });

      return "<li" + (q.done ? " class=\"done\"" : "") + "><span>" + esc(q.text) + (q.done ? " <small>Besvart</small>" : "") + "</span>" + like + tools + "</li>";

  // ---------- Kopiering ----------
  var toastT = null;
  function toast(msg) {

    t.textContent = msg; t.classList.add("show");

  function copyText(text, btn, label) {
    var say = btn.closest(".say");

      btn.classList.add("done"); btn.textContent = "Kopiert";

      setTimeout(function () { btn.classList.remove("done"); btn.textContent = label || "Kopier"; if (say) say.classList.remove("copied"); }, 1500);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select();
      try { if (document.execCommand("copy")) ok(); else throw new Error(); } catch (e) { toast("Kunne ikke kopiere. Marker teksten og kopier selv."); }
      document.body.removeChild(ta);

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  // ---------- Bli med ----------

  // ---------- Klikk og taster ----------
  var PANELS = { roster: "#roomChip", qpanel: "#qChip" };
  function togglePanel(id, show) {
    var el = $("#" + id);
    if (show === undefined) show = el.classList.contains("hidden");

    if (show && id === "roster") renderRoster();
    if (show && id === "qpanel") { renderQ(); if ($("#askIn") && !st.isPresenter) $("#askIn").focus(); }
  }
  var lastReact = 0;
  function react(e) {
    var now = Date.now();
    if (now - lastReact < 300) return;
    lastReact = now;
    burst(e);
    send({ t: "react", e: e });
  }
  function burst(emoji) {
    if (EMOJI.indexOf(emoji) < 0) return;
    var fx = $("#fx");
    if (fx.childElementCount > 40) return;
    var el = document.createElement("div");
    el.className = "float"; el.textContent = emoji;
    el.style.left = (8 + Math.random() * 84) + "%";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }

  document.addEventListener("click", function (e) {
    if (e.target.id === "overview") { openSorter(false); return; }
    if (!e.target.closest("#roster, #roomChip")) togglePanel("roster", false);
    if (!e.target.closest("#qpanel, #qChip, #askBtn")) togglePanel("qpanel", false);
    var t = e.target.closest("button");
    if (!t) return;
    var s = current();
    if (t.dataset.copy !== undefined) { copyText(t.dataset.copy, t); return; }
    if (t.dataset.goid) {
      var gid = t.dataset.goid;
      var gs = SLIDES.filter(function (x) { return x.id === gid; })[0];
      if (gs && isHidden(gs) && st.isPresenter) { var nh = Object.assign({}, st.hidden); nh[gid] = false; send({ t: "hide", slide: gid, on: false }); applyHidden(nh); }
      openSorter(false);
      if (indexOf(gid) >= 0) go(indexOf(gid), { manual: true });
      return;
    }
    if (t.dataset.hide) {
      var hid = Object.assign({}, st.hidden), sid = t.dataset.hide, on = !isHidden(SLIDES.filter(function (x) { return x.id === sid; })[0]);
      if (net.open && !send({ t: "hide", slide: sid, on: on })) return;
      hid[sid] = on;
      applyHidden(hid);
      renderOverview();
      return;
    }
    if (t.dataset.react) { react(t.dataset.react); return; }
    if (t.dataset.spot) { send({ t: "spot", wall: t.dataset.spot, id: t.dataset.id }); return; }
    if (t.dataset.qspot) { send({ t: "spot", q: t.dataset.qspot }); return; }
    if (t.dataset.qdone) {
      var q = st.questions.filter(function (x) { return x.id === t.dataset.qdone; })[0];

  // ---------- Malmodus ----------
  // ?mal er siden der man lager sitt eget kurs med Claude, og ?mal&vis viser utkastet. Innholdet er JSON i samme form
  // som SLIDES. Det sjekkes og renses både når det limes inn og når en nedlastet fil åpnes, så ingen tekst blir kode.
  function str(v, max) { return typeof v === "string" ? v.trim().slice(0, max) : ""; }
  function okUrl(u) { return typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u) ? u : ""; }
  function okSrc(u) { return typeof u === "string" && /^(https:\/\/|memer\/|bilder\/)[^\s"'<>]+$/.test(u) ? u : ""; }
  function slug(t) {

  function cleanCourse(input) {

    }
    if (!c || typeof c !== "object" || !Array.isArray(c.slides) || !c.slides.length) return { error: "Fant ingen sider. JSON-en må ha en liste som heter «slides»." };

        (Array.isArray(p.options) ? p.options : []).filter(function (o) { return Array.isArray(o) && KEY.test(o[0]) && str(o[1], 200); })
          .slice(0, 8).map(function (o) { return [o[0], str(o[1], 200)]; });

      if (options.some(function (o) { return o[0] === p.answer; })) { out.answer = p.answer; if (str(p.explain, 600)) out.explain = str(p.explain, 600); }

    function block(b) {

      if (b.t === "p") return str(b.text, 1200) ? { t: "p", text: str(b.text, 1200) } : null;
      if (b.t === "list") {
        var items = (Array.isArray(b.items) ? b.items : []).map(function (x) { return str(x, 400); }).filter(Boolean).slice(0, 12);
        return items.length ? { t: "list", items: items } : null;
      }
      if (b.t === "links") {
        var ls = (Array.isArray(b.items) ? b.items : []).filter(function (l) { return Array.isArray(l) && str(l[0], 120) && okUrl(l[1]); })
          .slice(0, 8).map(function (l) { return [str(l[0], 120), l[1], str(l[2], 200)]; });

      }
      ["blocks", "after"].forEach(function (f) {
        var bs = (Array.isArray(s[f]) ? s[f] : []).map(block).filter(Boolean).slice(0, 8);
        if (bs.length) o[f] = bs;
      });
      if (s.meme && okSrc(s.meme.src)) o.meme = { src: s.meme.src, alt: str(s.meme.alt, 400) || "Et bilde" };
      var sp = s.styleprompt, spPoll = sp && polls.filter(function (p) { return p.id === sp.poll; })[0];
      if (spPoll && str(sp.template, 2000).indexOf("{stil}") >= 0) {
        o.styleprompt = { poll: sp.poll, template: str(sp.template, 2000), fill: {} };
        spPoll.options.forEach(function (op) { o.styleprompt.fill[op[0]] = str(sp.fill && sp.fill[op[0]], 200) || op[1].toLowerCase(); });
      }
      var notes = (Array.isArray(s.notes) ? s.notes : []).map(function (x) { return str(x, 600); }).filter(Boolean).slice(0, 30);
      if (notes.length) o.notes = notes;
      ["art", "artAfter", "stats"].forEach(function (f) { if (s[f]) warn.push(n + ": «" + f + "» virker bare i originalkurset og er tatt bort."); });
      return o;
    }).filter(Boolean);
    if (c.slides.length > 60) warn.push("Bare de første 60 sidene er tatt med.");
    if (!slides.filter(function (s) { return !s.backstage; }).length) return { error: "Ingen av sidene har tittel." };
    var url = str(c.url, 200).replace(/^https?:\/\//, "").replace(/\/+$/, "");
    if (url && !/^[a-z0-9.-]+\.[a-z]{2,}(\/[A-Za-z0-9._~%\/-]*)?$/i.test(url)) { warn.push("Lenken er tatt bort, fordi den ikke ser ut som en vanlig nettadresse."); url = ""; }
    return { course: { title: str(c.title, 120) || slides[0].title, url: url, fields: fields, chapters: chapters, slides: slides }, warn: warn };
  }

  // Dette kurset som eksempel for Claude, uten det som bare virker her.
  function exampleCourse() {
    return {
      title: SLIDES[0].title, fields: FIELDS,
      slides: SLIDES.map(function (s) {
        var o = JSON.parse(JSON.stringify(s));
        ["art", "artAfter", "artAside", "stats"].forEach(function (f) { delete o[f]; });
        if (o.blocks) o.blocks = o.blocks.filter(function (b) { return /^(p|list|links|img)$/.test(b.t); });
        if (o.blocks && !o.blocks.length) delete o.blocks;
        (o.steps || []).forEach(function (x) { delete x.key; });
        (o.polls || []).forEach(function (p) { if (p.id === "felt") delete p.options; });
        return o;
      })
    };
  }
  function malInfo() { try { return JSON.parse(load("localStorage", "kurs.mal.info") || "{}") || {}; } catch (e) { return {}; } }
  function malAbout(info) {
    function v(k, d) { return str(info[k], 400) || d; }
    return "Tema: " + v("tema", "[tema]") + "\nHvem som kommer: " + v("hvem", "[antall, fagfelt og hvor mye de kan fra før]") +
      "\nLengde og format: " + v("lengde", "45 minutter, i møterom og på Teams") + "\nEtter kurset skal de kunne: " + v("laere", "[to eller tre ting]");
  }
  function malPrompt(info, example) {
    return "Du skal lage innholdet til et interaktivt kurs. Kurset vises i en ferdig kursside, malen fra «Introduksjon til Claude» fra KI Norge i Digdir. Du skriver bare innholdet, som JSON.\n\n" +
      "Om kurset:\n" + malAbout(info).replace(/^/gm, "- ") + "\n\n" +
      "Slik gjør du det:\n" +
      "1. Still meg høyst tre korte spørsmål hvis noe viktig mangler. Ellers går du rett på.\n" +
      "2. Planlegg rundt 35 av 45 minutter, eller tilsvarende. Én ting per side, og hver side er Se, Gjør eller Del. Start med noe alle gjør, og avslutt med at deltakerne skriver hva de skal prøve i morgen.\n" +
      "3. Korte titler, og høyst to prompter eller oppgaver synlige per side. Tørr humor som hører til poenget. Ikke moraliser.\n" +
      "4. Notatene til presentøren er et kort manus: det som skal sies, og → foran det som skal gjøres.\n" +
      "5. Sjekk fakta. Si fra når du er usikker, og dikt aldri opp kilder.\n" +
      "6. Svar til slutt med hele kurset som gyldig JSON i én kodeblokk, uten kommentarer.\n\n" +
      "Formatet:\n{ \"title\": \"Kursets navn\", \"url\": \"valgfritt, adressen der kurset skal ligge\", \"fields\": [[\"id\", \"Fagfelt\"]], \"slides\": [ … ] }\n\n" +
      "Feltene på en side:\n" +
      "- id: små bokstaver, tall og bindestrek, unik.\n" +
      "- ch: kapittelet. Bruk tre til fem kapitler.\n" +
      "- mode: \"se\", \"gjor\" eller \"del\". min: minutter.\n" +
      "- kicker, title, lead: overtittel, tittel og ingress.\n" +
      "- dark: true gir en mørk side, til åpning, pauser og slutt.\n" +
      "- polls: avstemninger, [{ \"id\": \"…\", \"q\": \"Spørsmål\", \"options\": [[\"a\", \"Svar\"]], \"answer\": \"a\", \"explain\": \"…\" }]. answer og explain bare når det finnes en fasit. gate: true holder resten av siden tilbake til fasiten er vist.\n" +
      "- steps: stegene i en oppgave, [{ \"text\": \"Hva deltakeren gjør\", \"say\": \"Prompten de kopierer\" }]. say kan være ett objekt med én tekst per fagfelt, der \"_\" er standard. bonus: true er et ekstrasteg for de raske. wall: \"id\" lar dem lime inn noe på en felles vegg. poll: en avstemning som steg.\n" +
      "- track: true viser velgeren for fagfelt over stegene.\n" +
      "- wall: { \"id\": \"…\", \"placeholder\": \"…\" } er en vegg for hele siden.\n" +
      "- blocks og after: [{ \"t\": \"p\", \"text\": \"…\" }, { \"t\": \"list\", \"items\": [\"…\"] }, { \"t\": \"links\", \"h\": \"Overskrift\", \"items\": [[\"Navn\", \"https://…\", \"Kort om lenken\"]] }]. after kommer når fasiten er vist.\n" +
      "- meme: { \"src\": \"https://api.memegen.link/images/<mal>/<topp>/<bunn>.jpg\", \"alt\": \"Hva bildet viser og sier\" }. Mellomrom skrives som _. På Gjør-sider kommer memen når stegene er gjort.\n" +
      "- notes: [\"…\"], bare for presentøren.\n" +
      "- cut: true kan kuttes hvis det går tregt. off: true er skjult til presentøren skrur den på.\n" +
      "- qr: true på startsiden viser adressen stort, hvis url er satt.\n" +
      "- cheat: true på siste side gir knappen «Ta med juksearket», med promptene fra kurset.\n\n" +
      "Vil du at deltakerne skal få eksempler fra sitt eget felt, lag \"fields\" og en avstemning med id \"felt\" tidlig i kurset. Den trenger ikke options." +
      (example ? "\n\nHer er innholdet i «Introduksjon til Claude» som eksempel på formatet og stilen. Bruk det som mal, ikke som innhold.\n\n```json\n" + JSON.stringify(exampleCourse()) + "\n```\n" : "");
  }
  function malField(id, label, ph, info) {
    return "<p class=\"mal-field\"><label for=\"mal-" + id + "\">" + esc(label) + "</label><input id=\"mal-" + id + "\" data-mal=\"" + id + "\" value=\"" + esc(info[id] || "") + "\" placeholder=\"" + esc(ph) + "\" autocomplete=\"off\"></p>";
  }
  function renderMal() {
    var info = malInfo();
    document.body.classList.add("mal-edit");
    $("#slide").className = "slide mal";
    $("#slide").innerHTML =
      "<p class=\"kicker\">Malmodus</p><h1 class=\"title\">Lag ditt eget kurs</h1>" +
      "<p class=\"lead\">Med Claude og denne kurssiden som mal. Du trenger ingen konto og ingen GitHub, bare claude.ai.</p>" +
      "<ol class=\"mal-steps\">" +
      "<li><h2>Fortell om kurset</h2><div class=\"mal-grid\">" +
        malField("tema", "Tema", "For eksempel klarspråk i vedtak", info) + malField("hvem", "Hvem kommer", "Antall, fagfelt og hvor mye de kan fra før", info) +
        malField("lengde", "Lengde og format", "45 minutter, i møterom og på Teams", info) + malField("laere", "Etter kurset skal de kunne", "To eller tre ting", info) + "</div></li>" +
      "<li><h2>Kopier prompten til Claude</h2><p>Lim den inn i en ny samtale i claude.ai, og svar på spørsmålene den stiller. Til slutt får du kurset som JSON i en kodeblokk.</p>" +
        "<div class=\"say\"><p class=\"bubble\" id=\"malPrompt\"></p><button class=\"copy\" id=\"malCopy\" aria-label=\"Kopier hele prompten\">Kopier</button></div>" +
        "<details><summary>Se hele prompten</summary><pre id=\"malFull\"></pre></details>" +
        "<p class=\"fine\">Når du kopierer, kommer innholdet i «Introduksjon til Claude» med som eksempel, så Claude ser formatet og stilen.</p></li>" +
      "<li><h2>Lim inn svaret</h2><label class=\"mal-label\" for=\"malIn\">JSON-en fra Claude</label>" +
        "<textarea id=\"malIn\" rows=\"8\" spellcheck=\"false\" autocomplete=\"off\">" + esc(load("localStorage", "kurs.mal.utkast") || "") + "</textarea>" +
        "<p class=\"mal-check\" id=\"malCheck\" role=\"status\"></p>" +
        "<button class=\"small-btn\" id=\"malExample\">Eller start med «Introduksjon til Claude»</button></li>" +
      "<li><h2>Se kurset og last det ned</h2><div class=\"acts\"><button class=\"btn primary\" id=\"malShow\">Se kurset</button><button class=\"btn\" id=\"malDownload\">Last ned som HTML-fil</button></div>" +
        "<ul class=\"list mal-help\"><li>Fila er hele kurset. Åpne den i en nettleser, del den i Teams, eller last den opp i claude.ai og be Claude endre noe.</li>" +
        "<li>Skriv <b>#presenter</b> bak adressen, så får du notatene og presentørvisningen.</li>" +
        "<li>Uten live-tjenesten blar hver deltaker selv, og avstemninger og vegger viser bare ens eget svar.</li></ul></li></ol>";
    malUpdate();
  }
  function malUpdate() {
    var info = {};
    document.querySelectorAll("[data-mal]").forEach(function (el) { info[el.dataset.mal] = el.value; });
    save("localStorage", "kurs.mal.info", JSON.stringify(info));
    var raw = $("#malIn").value;
    save("localStorage", "kurs.mal.utkast", raw.trim() ? raw : null);
    $("#malPrompt").textContent = malAbout(info);
    $("#malFull").textContent = malPrompt(info, false);
    var r = raw.trim() ? cleanCourse(raw) : null, ok = !!(r && r.course), el = $("#malCheck");
    el.className = "mal-check" + (r ? (ok ? " ok" : " bad") : "");
    if (!r) el.textContent = "Når du har limt inn svaret, ser du her om det er i orden.";
    else if (!ok) el.textContent = r.error;
    else {
      var c = r.course, tasks = 0, polls = 0;
      c.slides.forEach(function (s) { if (s.steps) tasks++; polls += (s.polls || []).length; });
      el.textContent = "✓ «" + c.title + "»: " + c.slides.length + " sider" + (c.chapters.length ? " i " + c.chapters.length + " kapitler" : "") +
        ", " + tasks + " med oppgaver, " + polls + " avstemninger." + (r.warn.length ? " " + r.warn.slice(0, 3).join(" ") : "");
    }
    $("#malShow").disabled = $("#malDownload").disabled = !ok;
  }

  // Lager én HTML-fil med kurset: denne siden, med innholdet lagt inn i CUSTOM. Bildene får full adresse.
  function exportCourse(course) {
    var base = location.href.split(/[?#]/)[0].replace(/[^\/]*$/, ""), c = JSON.parse(JSON.stringify(course));
    function abs(u) { return /^https:/.test(u) ? u : base + u; }
    c.slides.forEach(function (s) {
      if (s.meme) s.meme.src = abs(s.meme.src);
      (s.blocks || []).concat(s.after || []).forEach(function (b) { if (b.t === "img") b.src = abs(b.src); });
    });
    var json = JSON.stringify(c).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
    function build(src) {
      var re = /var CUSTOM = .*; \/\/ MAL/, t = esc(c.title);
      if (!src || !re.test(src)) { toast("Fant ikke malen. Last siden på nytt og prøv igjen."); return; }
      var out = src.replace(re, function () { return "var CUSTOM = " + json + "; // MAL"; })
        .replace(/<title>[^<]*<\/title>/, function () { return "<title>" + t + "</title>"; })
        .replace(/(<meta property="og:title" content=")[^"]*/, function (m, a) { return a + t; });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([out], { type: "text/html;charset=utf-8" }));
      a.download = slug(c.title) + ".html";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast("Fila " + a.download + " er lastet ned.");
    }
    if (/^https?:$/.test(location.protocol) && window.fetch) {
      fetch(location.pathname, { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : SOURCE; }).then(build, function () { build(SOURCE); });
    } else build(SOURCE);
  }
  function malDraft() { var r = cleanCourse(load("localStorage", "kurs.mal.utkast") || ""); return r.course || null; }

  // ---------- Oppstart ----------
  function measure() {
    var r = document.documentElement.style;
    r.setProperty("--head-h", $("#top").offsetHeight + "px");
    r.setProperty("--foot-h", SCREEN ? "0px" : $("#bar").offsetHeight + "px");
  }
  window.addEventListener("resize", measure);
  if (window.ResizeObserver) { var ro = new ResizeObserver(measure); ro.observe($("#top")); ro.observe($("#bar")); }

  // Limes presentørlenken inn i en fane der kurset alt er åpent, endres bare hashen.
  window.addEventListener("hashchange", function () {
    if (/^#presenter/.test(location.hash) && (CUSTOM || /^#presenter=/.test(location.hash))) { location.reload(); return; }
    if (EDIT) return;
    var m = /^#\/([A-Za-z0-9_-]+)$/.exec(location.hash || ""), k = m ? indexOf(m[1]) : -1;
    if (k >= 0 && k !== st.i) go(k, { manual: true });
  });

  document.body.classList.toggle("screen", SCREEN);
  if (EDIT || CUSTOM) { $(".brand").textContent = document.title = EDIT ? "Lag ditt eget kurs" : CUSTOM.title; }
  $("#joinHint").innerHTML = "Bli med: <b>" + esc(COURSE_URL) + "</b>";
  var start = /^#\/([A-Za-z0-9_-]+)$/.exec(location.hash || "");
  if (start && indexOf(start[1]) >= 0) st.i = indexOf(start[1]);
  if (EDIT) renderMal(); else render();
  measure();
  connect();
})();
</script>
</body>
