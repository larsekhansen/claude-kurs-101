<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Introduksjon til Claude</title>
<meta name="description" content="Kurs fra KI Norge. Følg presentasjonen, gjør oppgavene og del svarene, uten å logge inn.">
<meta property="og:title" content="Introduksjon til Claude">
<meta property="og:description" content="Kurs fra KI Norge. Følg presentasjonen, gjør oppgavene og del svarene, uten å logge inn.">
<meta name="theme-color" content="#F8F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1416" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 4h18a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-3l-6 5v-5H7a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z' fill='%23B42946'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=PT+Serif:wght@400;700&display=swap">
<style>
  /* Paletten er ki.norge.no sin: vinrødt og crimson, fersken og korall på varm papirbakgrunn. */
  :root {
    --paper: #F8F3EE; --surface: #FFFDFB; --ink: #292C30; --muted: #5B5D60; --heading: #541321;
    --accent: #B42946; --accent-hover: #912138; --accent-ink: #FFFFFF;
    --line: #E8DCD3; --line-strong: #CFBBAE;
    --bubble: #FCDCC6; --bubble-ink: #3B2417; --apricot: #E9B596; --blush: #F6E4E8;
    --coral: #F5898D; --coral-ink: #3F0D17; --ok: #056D13; --ok-bg: #DAEDDD;
    --note: #FCF0D9; --note-line: #ECD29C; --note-ink: #3D2B0B;
    --dark-bg: #541321; --dark-ink: #FBF3F1; --dark-soft: #FCC9A9; --dark-mark: #F5898D; --dark-line: rgba(252, 201, 169, .3);
    --scrim: rgba(52, 14, 22, .5); --shadow: 0 12px 32px rgba(84, 19, 33, .16);
    --serif: "PT Serif", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1416; --surface: #261B1E; --ink: #F1E8E9; --muted: #BBAAAD; --heading: #FAD9CF;
      --accent: #EE8A9C; --accent-hover: #F6A7B4; --accent-ink: #2B0A12;
      --line: #3A2A2E; --line-strong: #5C454B;
      --bubble: #3D2A21; --bubble-ink: #F9E7DB; --apricot: #C9906F; --blush: #3A2328;
      --coral: #F5898D; --coral-ink: #3F0D17; --ok: #8FD49A; --ok-bg: #1D3822;
      --note: #342A1A; --note-line: #6E5630; --note-ink: #F5E6C4;
      --dark-bg: #3F0E19; --dark-ink: #FBF3F1; --dark-soft: #FCC9A9; --dark-mark: #F5898D; --dark-line: rgba(252, 201, 169, .22);
      --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1416; --surface: #261B1E; --ink: #F1E8E9; --muted: #BBAAAD; --heading: #FAD9CF;
    --accent: #EE8A9C; --accent-hover: #F6A7B4; --accent-ink: #2B0A12;
    --line: #3A2A2E; --line-strong: #5C454B;
    --bubble: #3D2A21; --bubble-ink: #F9E7DB; --apricot: #C9906F; --blush: #3A2328;
    --coral: #F5898D; --coral-ink: #3F0D17; --ok: #8FD49A; --ok-bg: #1D3822;
    --note: #342A1A; --note-line: #6E5630; --note-ink: #F5E6C4;
    --dark-bg: #3F0E19; --dark-ink: #FBF3F1; --dark-soft: #FCC9A9; --dark-mark: #F5898D; --dark-line: rgba(252, 201, 169, .22);
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 18px; line-height: 1.55;
    padding-bottom: var(--foot-h, 72px);
  }
  a { color: var(--accent); text-underline-offset: .18em; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Topp ---------- */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 20px 10px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--heading); white-space: nowrap; }
  .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .grow { flex: 1; }
  .progress { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: var(--accent); transition: width .3s ease; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 14px;
    border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface);
    font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  button.chip:hover { border-color: var(--accent); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .chip .dot.on { background: var(--ok); }
  .chip.following::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .chip.action { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip.action:hover { background: var(--accent-hover); }

  /* ---------- Scenen ---------- */
  .stage { min-height: calc(100vh - var(--head-h, 60px) - var(--foot-h, 72px)); min-height: calc(100dvh - var(--head-h, 60px) - var(--foot-h, 72px)); transition: background-color .35s ease, color .35s ease; }
  body.dark-slide .stage { background: var(--dark-bg); color: var(--dark-ink); }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 24px 72px; }
  @media (max-width: 640px) { main { padding: 28px 16px 56px; } }

  .mode { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 18px; padding: 5px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .mode.se { background: var(--blush); color: var(--heading); }
  .mode.gjor { background: var(--accent); color: var(--accent-ink); }
  .mode.del { background: var(--bubble); color: var(--bubble-ink); }
  .kicker { margin: 0 0 12px; color: var(--accent); font-weight: 600; font-size: 16px; }
  h1.title {
    font-family: var(--serif); font-weight: 700; color: var(--heading);
    font-size: clamp(36px, 5.6vw, 64px); line-height: 1.05; letter-spacing: -.01em;
    margin: 0 0 18px; max-width: 18ch; text-wrap: balance;
  }
  .lead { font-size: clamp(19px, 2.2vw, 24px); color: var(--muted); margin: 0; max-width: 44ch; }
  .slide p { max-width: 64ch; }
  body.dark-slide .kicker { color: var(--dark-soft); }
  body.dark-slide h1.title { color: var(--dark-ink); }
  body.dark-slide .lead { color: var(--dark-soft); }
  body.dark-slide a { color: var(--dark-soft); }

  /* Prompter er replikker i en samtale, ikke kode. */
  .say { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .bubble {
    flex: 1 1 280px; margin: 0; padding: 14px 20px;
    background: var(--bubble); color: var(--bubble-ink);
    border-radius: 20px 20px 4px 20px; font-size: 18px; line-height: 1.45; overflow-wrap: anywhere;
    transition: box-shadow .2s ease;
  }
  .say.copied .bubble { box-shadow: 0 0 0 2px var(--accent); }
  .copy, .small-btn {
    flex: none; min-height: 38px; padding: 6px 16px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--surface); font-size: 14px; font-weight: 600;
  }
  .copy:hover, .small-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy.done, .copy.done:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* Steg: bare det aktive er åpent, resten tar lite plass. */
  .steps { list-style: none; margin: 40px 0 0; padding: 0; display: grid; gap: 12px; max-width: 780px; }
  .step { border: 1px solid var(--line); border-radius: 18px; padding: 14px 20px; background: var(--surface); }
  .step .h { display: flex; gap: 14px; align-items: baseline; }
  .step .no { flex: none; min-width: 1.4em; font-family: var(--serif); font-weight: 700; color: var(--accent); }
  .step .t { flex: 1; }
  .step .body { display: grid; gap: 18px; margin-top: 18px; }
  .step.current { padding: 24px 24px 26px; border: 2px solid var(--accent); }
  .step.current .t { font-size: 20px; font-weight: 600; }
  .step.done { background: transparent; border-style: dashed; color: var(--muted); }
  .step.done .no { color: var(--ok); }
  .step.later { opacity: .55; }
  .step.bonus { border-style: dashed; background: transparent; }
  .step.bonus .no { color: var(--apricot); }
  .step .acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .step .count-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 10px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .meter { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .finished { margin: 28px 0 0; font-weight: 600; color: var(--ok); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 42px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--surface);
    font-size: 15px; font-weight: 600; line-height: 1.1; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.stop { background: var(--heading); border-color: var(--heading); color: var(--paper); }
  .btn.round { width: 44px; padding: 0; font-size: 19px; }
  .btn.emoji { width: 44px; padding: 0; font-size: 20px; }
  .btn.hand-on { background: var(--coral); border-color: var(--coral); color: var(--coral-ink); }
  .btn.on { background: var(--note); border-color: var(--note-line); color: var(--note-ink); }
  .btn.quiet { border-color: transparent; background: transparent; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: .2em; }
  .btn.quiet:hover:not(:disabled) { border-color: transparent; color: var(--accent); }

  .tracks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 28px 0 0; font-size: 14px; color: var(--muted); max-width: 780px; }
  .tracks button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
  .tracks button[aria-pressed="true"] { background: var(--heading); border-color: var(--heading); color: var(--paper); }

  /* Avstemninger */
  .polls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 36px 44px; margin: 40px 0 0; max-width: 1080px; }
  .poll { margin: 0; max-width: 780px; }
  .step .poll { margin-top: 4px; }
  .poll h2 { margin: 0 0 14px; font-family: var(--serif); font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; color: var(--heading); }
  .opts { display: grid; gap: 8px; }
  .opt {
    position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 13px 18px; border-radius: 14px;
    border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 17px;
  }
  .opt .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--bubble); transition: width .4s ease; }
  .opt > span:not(.fill) { position: relative; }
  .opt .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
  .opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--blush); font-weight: 600; }
  div.opt { cursor: default; }

  /* Veggen */
  .wall { margin: 18px 0 0; display: grid; gap: 14px; max-width: 780px; }
  .post-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .post-form input { flex: 1 1 260px; font-size: 17px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--paper); }
  .post-form input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .posts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .posts li { padding: 12px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 17px; overflow-wrap: anywhere; }
  .posts li.fresh { animation: pop .5s ease; }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .posts-empty { color: var(--muted); font-size: 15px; margin: 0; }
  .wall-h { margin: 44px 0 0; font-size: 15px; font-weight: 600; color: var(--muted); }

  /* Neste ord */
  .sim { margin: 32px 0 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 32px; align-items: start; max-width: 1040px; }
  @media (max-width: 860px) { .sim { grid-template-columns: 1fr; } .net { display: none; } }
  .phrases { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; }
  .phrases button { border: 0; background: var(--surface); padding: 8px 12px; font-size: 14px; font-weight: 600; text-align: left; }
  .phrases button[aria-pressed="true"] { background: var(--heading); color: var(--paper); }
  .sentence { font-family: var(--serif); font-size: clamp(24px, 3vw, 32px); line-height: 1.3; min-height: 2.8em; margin: 22px 0 14px; color: var(--heading); }
  .sentence .w { border-radius: 6px; }
  .sentence .w.new { background: var(--bubble); color: var(--bubble-ink); padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .sentence .w.wait { color: var(--line-strong); }
  .cands { display: grid; gap: 6px; margin: 0 0 18px; }
  .cand { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 15px; }
  .cand.picked { font-weight: 700; color: var(--accent); }
  .cand .p { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .net { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .net line { stroke: var(--line); stroke-width: 1; transition: stroke .35s ease; }
  .net line.hot { stroke: var(--accent); stroke-width: 2; }
  .net circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; transition: fill .35s ease; }
  .net circle.hot { fill: var(--bubble); stroke: var(--accent); }
  .fine { font-size: 14px; color: var(--muted); margin: 10px 0 0; }

  .models { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 40px 0 0; max-width: 880px; }
  @media (max-width: 640px) { .models { grid-template-columns: 1fr 1fr; } }
  .models div { padding: 18px 18px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  .models b { display: block; font-family: var(--serif); font-size: 26px; color: var(--heading); }
  .models span { font-size: 15px; color: var(--muted); }
  .scale { display: flex; justify-content: space-between; max-width: 880px; margin-top: 10px; font-size: 14px; color: var(--muted); }

  .meme { margin: 44px 0 0; max-width: 420px; }
  .meme img { display: block; width: 100%; height: auto; border-radius: 12px; }

  .qr { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin-top: 44px; }
  .qr svg { width: 168px; height: 168px; padding: 10px; background: #fff; border-radius: 14px; }
  .qr .url { margin: 0; font-size: 20px; font-weight: 600; }
  .qr .url small { display: block; font-size: 16px; font-weight: 400; color: var(--dark-soft); }

  .list { margin: 32px 0 0; padding: 0 0 0 1.2em; max-width: 64ch; display: grid; gap: 10px; }
  .links { margin: 44px 0 0; max-width: 780px; }
  .links h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .links ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .links a { font-weight: 600; font-size: 18px; }
  .links span { display: block; color: var(--muted); font-size: 15px; }

  /* Presentørens notater: en gul lapp. */
  .notes {
    margin-top: 28px; max-width: 72ch; padding: 16px 20px;
    background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line);
    border-radius: 4px 4px 16px 4px; font-size: 16px;
  }
  .notes h2 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
  .notes p { margin: 0 0 8px; }
  .notes p:last-child { margin: 0; }

  /* ---------- Bunnlinje ---------- */
  footer.bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--paper); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) {
    header.top { padding-left: 16px; padding-right: 16px; gap: 8px; }
    .brand { font-size: 16px; }
    .count, .btn .lbl, .status, #meBtn.named { display: none; }
    .chip { padding: 6px 12px; }
    footer.bar { gap: 6px; padding-left: 10px; padding-right: 10px; }
    .group { gap: 4px; }
    .btn { padding: 8px 12px; }
    .btn.round, .btn.emoji, #handBtn { width: 40px; padding: 0; }
    .step.current { padding: 18px 16px 20px; }
  }

  /* ---------- Skjermen i møterommet ---------- */
  body.screen { font-size: 22px; padding-bottom: 0; }
  body.screen footer.bar, body.screen #menuBtn, body.screen .tracks, body.screen .post-form, body.screen .copy { display: none !important; }
  body.screen main { max-width: 1400px; }
  body.screen h1.title { font-size: clamp(48px, 6.4vw, 92px); }
  body.screen .qr svg { width: 280px; height: 280px; }
  body.screen .qr .url { font-size: 30px; }
  body.screen .meme { max-width: 520px; }
  body.screen .stage { min-height: calc(100dvh - var(--head-h, 60px)); }

  /* ---------- Paneler ---------- */
  .panel {
    position: fixed; z-index: 12; top: calc(var(--head-h, 60px) + 8px); right: 16px;
    width: min(400px, calc(100vw - 32px)); max-height: min(72vh, 600px); overflow: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px;
  }
  .panel .go { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font-size: 16px; }
  .panel .go:hover, .panel .go[aria-current="page"] { background: var(--blush); }
  .panel .go span { min-width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; }
  #roster { padding: 16px 18px; }
  #roster h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 22px; color: var(--heading); }
  #roster h3 { margin: 14px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  #roster h3 span { color: var(--ink); }
  .names { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: q; }
  .names li { padding: 3px 12px; border-radius: 999px; background: var(--blush); font-size: 15px; }
  .names li small { color: var(--muted); }
  ol.names li { background: var(--coral); color: var(--coral-ink); }
  ol.names li::before { counter-increment: q; content: counter(q) ". "; font-weight: 600; }
  .names li.anon { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); }
  ol.names li.anon::before { content: none; }
  .empty { margin: 0; color: var(--muted); font-size: 16px; }

  /* ---------- Bli med ---------- */
  .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
  .sheet { width: min(440px, 100%); background: var(--surface); border-radius: 22px; padding: 28px; box-shadow: var(--shadow); }
  .sheet h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 30px; line-height: 1.15; color: var(--heading); }
  .sheet p { margin: 0 0 18px; color: var(--muted); font-size: 17px; }
  .sheet input { width: 100%; font-size: 20px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--paper); }
  .sheet input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .sheet .err { margin: 6px 0 10px; min-height: 1.4em; color: var(--accent); font-size: 15px; }
  .sheet .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 640px) {
    .scrim { place-items: end center; padding: 0; }
    .sheet { border-radius: 22px 22px 0 0; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  }

  /* ---------- Reaksjoner og beskjeder ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
  .float { position: absolute; bottom: calc(var(--foot-h, 72px) + 8px); font-size: 36px; animation: rise 2.4s cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes rise {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    12% { transform: translateY(-28px) scale(1.08); opacity: 1; }
    100% { transform: translateY(-380px) scale(1); opacity: 0; }
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--foot-h, 72px) + 14px); z-index: 30;
    transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 999px;
    background: var(--heading); color: var(--paper); font-size: 15px; text-align: center;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  body.dark-slide .toast { background: var(--dark-soft); color: var(--dark-bg); }
  @media (prefers-reduced-motion: reduce) {
    .float { animation: fade 1.6s ease forwards; }
    @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
    .stage, .progress, .toast, .bubble, .meter i, .opt .fill, .net line, .net circle { transition: none; }
    .posts li.fresh { animation: none; }
  }

  }

  // ---------- Neste ord ----------

  };
  function simCands() {
    var w = st.sim.words;
    return w.length ? (SIM.next[w[w.length - 1]] || []) : SIM.first[st.sim.phrase];
  }
  function simDone() {
    var w = st.sim.words, last = w[w.length - 1];
    if (!w.length) return false;
    if (w.length >= 6) return true;
    if (SIM.open.indexOf(last) >= 0) return false;
    if (!SIM.next[last]) return true;
    return w.length >= 3;
  }
  function renderSim() {
    var el = $("#sentence");
    if (!el) return;
    var all = SIM.start[st.sim.phrase].concat(st.sim.words), done = simDone();
    el.innerHTML = all.map(function (w, i) {
      return "<span class=\"w" + (st.sim.picked && i === all.length - 1 ? " new" : "") + "\">" + esc(w) + "</span>";
    }).join(" ") + (done ? "." : " <span class=\"w wait\">…</span>");
    var c = done ? [] : simCands();
    $("#cands").innerHTML = c.map(function (x) {
      var p = Math.round(x[1] * 100);
      return "<div class=\"cand\"><span>" + esc(x[0]) + "</span><span class=\"meter\"><i style=\"width:" + p + "%\"></i></span><span class=\"p\">" + p + " %</span></div>";
    }).join("");
    $("#drawBtn").disabled = done;
    $("#shareBtn").disabled = !done || overview();
  }
  function simDraw() {
    if (simDone()) return;
    var c = simCands(), r = Math.random(), acc = 0, w = c[c.length - 1][0];
    for (var i = 0; i < c.length; i++) { acc += c[i][1]; if (r <= acc) { w = c[i][0]; break; } }
    st.sim.words.push(w);
    st.sim.picked = w;
    renderSim();
    lightUp();
    var s = current();
    if (simDone() && s.steps && progOf(s) < 1) setStep(s, 1);
  }
  function simSentence() { return SIM.start[st.sim.phrase].concat(st.sim.words).join(" ") + "."; }
  function simReset() { st.sim.words = []; st.sim.picked = null; renderSim(); lightUp(true); }
  var NET = { layers: [4, 6, 6, 6, 2], nodes: [], edges: [] };
  function drawNet() {
    var svg = $("#net");
    if (!svg) return;
    if (!NET.nodes.length) {
      var dx = 340 / (NET.layers.length - 1);
      NET.layers.forEach(function (n, li) {
        for (var i = 0; i < n; i++) NET.nodes.push({ l: li, x: 40 + li * dx, y: 150 + (i - (n - 1) / 2) * (n > 2 ? 220 / (n - 1) : 110) });
      });
      NET.nodes.forEach(function (a) { NET.nodes.forEach(function (b) { if (b.l === a.l + 1) NET.edges.push([a, b]); }); });
    }
    svg.innerHTML = NET.edges.map(function (e) { return "<line x1=\"" + e[0].x + "\" y1=\"" + e[0].y + "\" x2=\"" + e[1].x + "\" y2=\"" + e[1].y + "\"/>"; }).join("") +
      NET.nodes.map(function (n) { return "<circle cx=\"" + n.x + "\" cy=\"" + n.y + "\" r=\"7\"/>"; }).join("");
  }
  function lightUp(clear) {
    var lines = document.querySelectorAll("#net line"), circles = document.querySelectorAll("#net circle");
    if (!lines.length) return;
    lines.forEach(function (l) { l.classList.remove("hot"); });
    circles.forEach(function (c) { c.classList.remove("hot"); });
    if (clear) return;
    for (var p = 0; p < 3; p++) {
      var cur = NET.nodes[Math.floor(Math.random() * NET.layers[0])];
      circles[NET.nodes.indexOf(cur)].classList.add("hot");
      for (var l = 1; l < NET.layers.length; l++) {
        var opts = NET.edges.filter(function (e) { return e[0] === cur; });
        var e = opts[Math.floor(Math.random() * opts.length)];
        lines[NET.edges.indexOf(e)].classList.add("hot");
        cur = e[1];
        circles[NET.nodes.indexOf(cur)].classList.add("hot");
      }
    }
  }

  // ---------- Steg, svar og vegg ----------
  function setStep(s, n) {
    st.prog[s.id] = n;
    save("localStorage", "kurs.prog", JSON.stringify(st.prog));
    send({ t: "step", slide: s.id, n: n });
    var el = $("#steps");
    if (el) el.outerHTML = stepsHtml(s);
    if (s.meme && n >= core(s).length) render(true); // memen er belønningen når alle stegene er gjort
  }
  function vote(poll, opt) {
    st.ans[poll] = opt;
    save("localStorage", "kurs.ans", JSON.stringify(st.ans));
    send({ t: "vote", poll: poll, opt: opt });
  }
  function postTo(wall, text) {
    text = text.replace(/\s+/g, " ").trim();
    if (!text) return false;
    if (!send({ t: "post", wall: wall, text: text })) { toast("Får ikke kontakt akkurat nå. Prøv igjen om litt."); return false; }
    st.posted[wall] = 1;
    save("localStorage", "kurs.posted", JSON.stringify(st.posted));
    var s = current();
    (s.steps || []).forEach(function (x, i) {
      if (x.wall === wall && !x.bonus) { var idx = core(s).indexOf(x); if (progOf(s) <= idx) setStep(s, idx + 1); }
    });
    return true;
  }

  // ---------- Navigasjon ----------
  function go(n, opts) {
    var v = visible();
    if (n < 0 || n >= v.length) return;
    if (!st.isPresenter && opts && opts.manual && live()) st.following = false;
    st.i = n;
    render();
    if (st.isPresenter && st.broadcasting) pushLive();
  }
  function jumpTo(id) {
    var k = indexOf(id);
    if (k >= 0 && k !== st.i) { st.i = k; render(); }
  }
  function followLive() { if (live()) jumpTo(st.live.slide); }
  // Backstage vises aldri for publikum, så den sendes ikke.
  function pushLive() {
    var s = current();
    if (!s || s.backstage) return;
    st.live = { on: true, slide: s.id };
    send({ t: "go", on: true, slide: s.id });
  }
  function toggleLive() {
    var s = current();
    if (!st.broadcasting) {
      if (s.backstage) { toast("Gå til en vanlig side først. Backstage vises aldri for publikum."); return; }
      if (!send({ t: "go", on: true, slide: s.id })) return;
      st.broadcasting = true; st.live = { on: true, slide: s.id };
    } else {
      var slide = (st.live && st.live.slide) || s.id;
      if (!send({ t: "go", on: false, slide: slide })) return;
      st.broadcasting = false; st.live = { on: false, slide: slide };
    }
    updateBar();
  }

  // ---------- Statuslinjene ----------
  function updateBar() {
    var p = st.presence || { here: 0, hands: 0 };
    var here = $("#hereChip"), room = $("#roomChip"), fb = $("#followBtn");
    var dot = "<span class=\"dot" + (net.open ? " on" : "") + "\"></span>";
    here.classList.toggle("hidden", !net.ever || st.isPresenter);
    room.classList.toggle("hidden", !net.ever || !st.isPresenter);
    if (net.ever && st.isPresenter) {
      room.innerHTML = dot + "<span>" + p.here + " her</span><span>✋ " + p.hands + "</span>";
      room.setAttribute("aria-label", p.here + " her, " + p.hands + " med hånda oppe. Vis hvem.");
    } else if (net.ever) {
      here.innerHTML = dot + "<span>" + p.here + " her</span>";
    }

    if (!st.isPresenter && !SCREEN && net.ever && live()) {
      var k = indexOf(st.live.slide);
      fb.textContent = st.following ? "Følger presentasjonen" : "Gå til presentasjonen" + (k >= 0 ? " (" + (k + 1) + ")" : "");
      fb.className = "chip " + (st.following ? "following" : "action");
    } else fb.className = "chip hidden";

    var status = "";
    if (st.isPresenter) status = !net.open ? (net.failed ? "Ingen kontakt med live-tjenesten" : "Kobler til …") : st.broadcasting ? "Du styrer hva publikum ser" : "Publikum blar selv";
    else if (net.failed && !net.ever) status = "Solo-modus: bla selv med pilene.";
    else if (net.ever && !net.open) status = "Kobler til igjen …";
    else if (live() && st.following) status = "Presentasjonen styrer siden. Bla selv for å slippe.";
    $("#statusText").textContent = status;

    $("#presenterTools").classList.toggle("hidden", !st.isPresenter);

    lb.className = "btn " + (st.broadcasting ? "stop" : "primary");

    $("#clearBtn").disabled = !net.open || !st.verified;
    $("#wipeBtn").classList.toggle("hidden", !wallsOf(current()).length);
    $("#wipeBtn").disabled = !net.open || !st.verified;
    $("#notesBtn").setAttribute("aria-pressed", String(st.notesOpen));
    $("#notesBtn").classList.toggle("on", st.notesOpen);

    $("#viewerTools").classList.toggle("hidden", st.isPresenter || SCREEN || !net.ever);

  // ---------- Kopiering ----------
  var toastT = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function copyText(text, btn) {
    var say = btn.closest(".say");
    function ok() {
      btn.classList.add("done"); btn.textContent = "Kopiert";
      if (say) say.classList.add("copied");
      setTimeout(function () { btn.classList.remove("done"); btn.textContent = "Kopier"; if (say) say.classList.remove("copied"); }, 1500);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select();
      try { if (document.execCommand("copy")) ok(); else throw new Error(); } catch (e) { toast("Kunne ikke kopiere. Marker teksten og kopier selv."); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  // ---------- Bli med ----------
  var joinOpen = false, joinPending = false;

  function openJoin(taken) {
    if (st.isPresenter || SCREEN) return;
    joinOpen = true; joinPending = false;
    $("#join").classList.remove("hidden");
    setInert(true);
    var inp = $("#joinName");
    inp.value = taken || st.name || "";
    $("#joinErr").textContent = taken ? takenText(taken) : "";

  }
  function closeJoin(skipped) {

  }
  function takenText(name) { return "«" + name + "» er tatt. Legg til forbokstaven i etternavnet ditt."; }

    if (name === st.name) { closeJoin(); return; }
    if (!send({ t: "name", name: name })) { $("#joinErr").textContent = "Får ikke kontakt akkurat nå. Prøv igjen om litt."; return; }

  // ---------- Klikk og taster ----------
  function togglePanel(id, show) {
    var el = $("#" + id), btn = id === "overview" ? $("#menuBtn") : $("#roomChip");
    if (show === undefined) show = el.classList.contains("hidden");
    el.classList.toggle("hidden", !show);
    btn.setAttribute("aria-expanded", String(show));
    if (show && id === "roster") renderRoster();
  }
  var lastReact = 0;
  function react(e) {
    var now = Date.now();
    if (now - lastReact < 300) return;
    lastReact = now;
    burst(e);
    send({ t: "react", e: e });
  }
  function burst(emoji) {
    if (EMOJI.indexOf(emoji) < 0) return;
    var fx = $("#fx");
    if (fx.childElementCount > 40) return;
    var el = document.createElement("div");
    el.className = "float"; el.textContent = emoji;
    el.style.left = (8 + Math.random() * 84) + "%";
    fx.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest("#overview, #menuBtn")) togglePanel("overview", false);
    if (!e.target.closest("#roster, #roomChip")) togglePanel("roster", false);
    var t = e.target.closest("button");
    if (!t) return;
    var s = current();
    if (t.dataset.copy !== undefined) { copyText(t.dataset.copy, t); return; }
    if (t.dataset.go !== undefined) { togglePanel("overview", false); go(parseInt(t.dataset.go, 10), { manual: true }); return; }
    if (t.dataset.react) { react(t.dataset.react); return; }
    if (t.dataset.step) { setStep(s, progOf(s) + 1); return; }
    if (t.dataset.undo) { setStep(s, Math.max(0, progOf(s) - 1)); return; }
    if (t.dataset.poll) {
      vote(t.dataset.poll, t.dataset.opt);
      (s.steps || []).forEach(function (x) { if (x.poll && x.poll.id === t.dataset.poll) { var idx = core(s).indexOf(x); if (progOf(s) <= idx) setStep(s, idx + 1); } });
      if (t.dataset.poll === "felt" && s.track) render(true); else refresh();
      return;
    }
    if (t.dataset.track) { vote("felt", t.dataset.track === "_" ? "annet" : t.dataset.track); render(true); return; }
    if (t.dataset.phrase) { st.sim.phrase = t.dataset.phrase; st.sim.words = []; st.sim.picked = null; render(true); return; }
    switch (t.id) {
      case "prevBtn": go(st.i - 1, { manual: true }); break;
      case "nextBtn": go(st.i + 1, { manual: true }); break;
      case "menuBtn": togglePanel("overview"); break;
      case "roomChip": togglePanel("roster"); break;
      case "followBtn": if (!st.following) { st.following = true; followLive(); updateBar(); } break;
      case "handBtn": st.hand = !st.hand; send({ t: "me", hand: st.hand }); updateBar(); break;
      case "meBtn": openJoin(); break;
      case "joinSkip": closeJoin(true); break;
      case "liveBtn": toggleLive(); break;
      case "notesBtn": st.notesOpen = !st.notesOpen; render(); break;
      case "clearBtn": if (send({ t: "clear" })) toast("Alle hender er tatt ned."); break;
      case "wipeBtn": wallsOf(s).forEach(function (id) { send({ t: "wipe", wall: id }); }); break;
      case "drawBtn": simDraw(); break;
      case "againBtn": simReset(); break;
      case "shareBtn": if (postTo("setninger", simSentence())) { $("#shareBtn").disabled = true; toast("Delt. Se hva de andre fikk."); } break;
    }
  });
  document.addEventListener("submit", function (e) {
    var f = e.target.closest("form[data-wall]");
    if (!f) return;
    e.preventDefault();
    var inp = f.querySelector("input");
    if (postTo(f.dataset.wall, inp.value)) inp.value = "";
  });
  document.addEventListener("keydown", function (e) {
    if (joinOpen) { if (e.key === "Escape") closeJoin(true); return; }
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && tag !== "BUTTON")) { e.preventDefault(); go(st.i + 1, { manual: true }); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(st.i - 1, { manual: true }); }
    else if (e.key === "Home") go(0, { manual: true });
    else if (e.key === "End") go(visible().length - 1, { manual: true });
    else if (e.key === "Escape") { togglePanel("overview", false); togglePanel("roster", false); }
  });

  // ---------- Live ----------
  function connect() {
    clearTimeout(net.timer);
    if (!/^wss?:\/\//.test(LIVE_URL) || !window.WebSocket) { net.failed = true; updateBar(); return; }
    var ws;
    try { ws = new WebSocket(LIVE_URL); } catch (e) { retry(); return; }
    net.ws = ws;
    ws.onopen = function () {
      net.open = true; net.retry = 0; net.last = Date.now();
      send({ t: "hello", cid: cid, name: st.name, hand: st.hand, seen: st.seen, prog: st.prog, ans: st.ans, screen: SCREEN || undefined, token: token || undefined });
    };
    ws.onmessage = function (ev) {
      net.last = Date.now();
      if (ev.data === "pong") return;
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      onMessage(m);
    };
    ws.onclose = function () { if (net.ws === ws) drop(); };
  }
  function drop() {
    var ws = net.ws;
    net.ws = null; net.open = false;
    if (ws) { ws.onopen = ws.onmessage = ws.onclose = null; try { ws.close(); } catch (e) {} }
    if (!net.ever) net.failed = true;
    updateBar();
    retry();
  }
  function retry() {
    clearTimeout(net.timer);
    var wait = Math.min(15000, 1000 * Math.pow(2, net.retry++)) * (0.7 + Math.random() * 0.6);
    net.timer = setTimeout(connect, wait);
  }
  function send(m) {
    if (!net.ws || !net.open) return false;
    try { net.ws.send(JSON.stringify(m)); return true; } catch (e) { return false; }
  }
  // Ping holder forbindelsen i live og avslører døde forbindelser.
  setInterval(function () {
    if (!net.ws || !net.open) return;
    if (document.visibilityState === "visible" && Date.now() - net.last > 70000) { drop(); return; }
    try { net.ws.send("ping"); } catch (e) {}
  }, 25000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (net.ws && net.open && Date.now() - net.last > 70000) drop();
    else if (!net.ws) { net.retry = 0; connect(); }
  });

  function onMessage(m) {
    switch (m.t) {
      case "welcome": onWelcome(m); break;
      case "live": applyLive(m); break;
      case "presence": st.presence = m; refresh(); break;
      case "me": applyMe(m, false); break;
      case "name-taken": joinError(m.name); break;
      case "react": burst(m.e); break;
      case "clear": st.hand = false; st.seen = m.at || 0; updateBar(); break;
      case "wall":
        (st.walls[m.wall] || (st.walls[m.wall] = [])).push(m.item);
        st.fresh[m.item.id] = 1;
        refresh(); break;
      case "wall-wipe": delete st.walls[m.wall]; refresh(); break;
    }
  }
  function onWelcome(m) {
    net.ever = true; net.failed = false;
    st.seen = m.clearAt || 0;
    st.walls = m.walls || {};
    var was = st.isPresenter;
    st.verified = m.role === "presenter";
    st.isPresenter = st.verified;
    if (m.badToken) {
      token = null;
      save("sessionStorage", "kurs.presenter", null);
      toast("Presentørlenken er ikke gyldig. Du ser kurset som deltaker.");
    }
    if (m.role === "viewer") applyMe(m.me || {}, true);
    if (st.isPresenter) {
      if (st.broadcasting) pushLive(); // Var vi live før bruddet, er det vi som bestemmer siden.
      else applyLive(m.live || {});
    } else {
      applyLive(m.live || {});
      if (m.nameTaken) openJoin(m.nameTaken);
      else if (!SCREEN && !st.name && !net.asked && !load("sessionStorage", "kurs.skip")) openJoin();
      net.asked = true;
    }
    render(true);
  }
  function applyLive(l) {
    var was = live();
    st.live = { on: l.on === true, slide: l.slide || null };
    if (st.isPresenter) {
      st.broadcasting = st.live.on;
      if (st.live.on) jumpTo(st.live.slide);
    } else if (SCREEN) {
      jumpTo(st.live.on && st.live.slide ? st.live.slide : "start");
    } else {
      if (st.live.on && !was) st.following = true;
      if (st.following) followLive();
    }
    updateBar();
  }
  function applyMe(me, fromWelcome) {
    if (typeof me.hand === "boolean") st.hand = me.hand;
    var redraw = false;
    if (me.prog && typeof me.prog === "object") { redraw = JSON.stringify(me.prog) !== JSON.stringify(st.prog); st.prog = me.prog; save("localStorage", "kurs.prog", JSON.stringify(st.prog)); }
    if (me.ans && typeof me.ans === "object") { redraw = redraw || JSON.stringify(me.ans) !== JSON.stringify(st.ans); st.ans = me.ans; save("localStorage", "kurs.ans", JSON.stringify(st.ans)); }
    if (typeof me.name === "string" && (me.name || fromWelcome)) {
      st.name = me.name;
      if (me.name) save("localStorage", "kurs.name", me.name);
      if (joinOpen && joinPending && me.name) { closeJoin(); toast("Du er med som " + me.name + "."); }
    }
    if (redraw && !fromWelcome) render(true); else updateBar();
  }

  // ---------- Oppstart ----------
  function measure() {
    var r = document.documentElement.style;
    r.setProperty("--head-h", $("#top").offsetHeight + "px");
    r.setProperty("--foot-h", SCREEN ? "0px" : $("#bar").offsetHeight + "px");
  }
  window.addEventListener("resize", measure);
  if (window.ResizeObserver) { var ro = new ResizeObserver(measure); ro.observe($("#top")); ro.observe($("#bar")); }

  // Limes presentørlenken inn i en fane der kurset alt er åpent, endres bare hashen.
  window.addEventListener("hashchange", function () {
    if (/^#presenter=/.test(location.hash)) { location.reload(); return; }
    var m = /^#\/([A-Za-z0-9_-]+)$/.exec(location.hash || ""), k = m ? indexOf(m[1]) : -1;
    if (k >= 0 && k !== st.i) go(k, { manual: true });
  });

  document.body.classList.toggle("screen", SCREEN);
  var start = /^#\/([A-Za-z0-9_-]+)$/.exec(location.hash || "");
  if (start && indexOf(start[1]) >= 0) st.i = indexOf(start[1]);
  render();
  measure();
  connect();
})();
</script>
</body>
</html>
